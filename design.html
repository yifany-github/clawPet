        }

        .gear-spin {
            animation: spin 4s linear infinite;

        .lcd-bg {
            background-color: #9ea786;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 4px 4px;
        }

        .pixel-font {
            font-family: 'VT323', monospace;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            z-index: 20;
            background-size: 100% 4px;
            pointer-events: none;
            border-radius: 50%;
        }

        
        .glare::after {
            content: '';
            position: absolute;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 45%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.15), transparent);
            border-radius: 50% 50% 10% 10%;
            pointer-events: none;
            z-index: 30;
        }

        
        @keyframes squish {
            0%, 100% { transform: scale(1, 1) translateY(0); }
            50% { transform: scale(1.1, 0.8) translateY(4px); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .pet-animate {
            animation: float 2s ease-in-out infinite, squish 2s ease-in-out infinite;
        }

        
        .plastic-body {
            background: radial-gradient(circle at 30% 30%, #4ade80 0%, #22c55e 50%, #16a34a 100%);
            box-shadow: 
                inset -10px -10px 20px rgba(0,0,0,0.2),
                inset 10px 10px 20px rgba(255,255,255,0.4),
                15px 15px 35px rgba(0,0,0,0.3);
        }

        .plastic-button {
            box-shadow: 
                inset 2px 2px 5px rgba(255,255,255,0.4),
                inset -2px -2px 5px rgba(0,0,0,0.2),
                2px 2px 5px rgba(0,0,0,0.3);
        }
    </style>
    <script vid="4">
        let gearRotation = -15;
        let isHoveringGear = false;
        
        document.addEventListener('DOMContentLoaded', () => {
            const gearContainer = document.getElementById('gear-container');
            const gearRotator = document.getElementById('gear-rotator');
            
            gearContainer.addEventListener('mouseenter', () => isHoveringGear = true);
            gearContainer.addEventListener('mouseleave', () => isHoveringGear = false);
            
            window.addEventListener('wheel', (e) => {
                if (isHoveringGear) {
                    e.preventDefault();
                    gearRotation += e.deltaY * 0.4;
                    gearRotator.style.transform = `translate(40px,40px) rotate(${gearRotation}deg)`;
                }
            });
        });
    </script>
</head>
